apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-server
  namespace: apps
  labels:
    app: ai-server
spec:
  replicas: 1
  strategy:
    type: Recreate  # Rolling Update 대신 Recreate 사용
  selector:
    matchLabels:
      app: ai-server
  template:
    metadata:
      labels:
        app: ai-server
    spec:
      containers:
      - name: ai-server
        image: sangheon95/crescendo-ai-server:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: PORT
          value: "8000"
        - name: PERFORMANCE_MODE
          value: "balanced"
        - name: USE_GPU
          value: "False"
        - name: FLASK_ENV
          value: "production"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: S3_BUCKET_NAME
          value: "p31d102"
        - name: AWS_REGION
          value: "ap-northeast-2"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: crescendo-secrets
              key: aws-access-key
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: crescendo-secrets
              key: aws-secret-key
        resources:
          requests:
            memory: "6Gi"
            cpu: "1000m"
          limits:
            memory: "12Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /ai/omr/health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ai/omr/health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: uploads
          mountPath: /app/uploads
        - name: outputs
          mountPath: /app/outputs
      volumes:
      - name: uploads
        emptyDir: {}
      - name: outputs
        emptyDir: {}