apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crescendo-ai-ingress
  namespace: apps
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - cresd102.duckdns.org
    secretName: crescendo-tls
  rules:
  - host: cresd102.duckdns.org
    http:
      paths:
      - path: /ai
        pathType: Prefix
        backend:
          service:
            name: ai-server-service
            port:
              number: 8000